<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — João A. M. Neto</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hero-section.css">
  <link rel="stylesheet" href="./admin.css">
  <!-- Shaders for Suminagashi -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    precision highp float;
    uniform float uTime;
    uniform vec2 uMousePosition;
    uniform float uHue;
    uniform float uHueVariation;
    uniform float uDensity;
    uniform float uDisplacement;
    uniform float uSaturation;
    uniform float uLightness;
    uniform float uLightnessVariation;
    varying vec2 vUv;
    float mod289(float x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 perm(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
    float hue2rgb(float f1, float f2, float hue) {
      if (hue < 0.0) hue += 1.0;
      else if (hue > 1.0) hue -= 1.0;
      float res;
      if ((6.0 * hue) < 1.0) res = f1 + (f2 - f1) * 6.0 * hue;
      else if ((2.0 * hue) < 1.0) res = f2;
      else if ((3.0 * hue) < 2.0) res = f1 + (f2 - f1) * ((2.0 / 3.0) - hue) * 6.0;
      else res = f1;
      return res;
    }
    vec2 fade(vec2 t) { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }
    float cnoise(vec2 P) {
      vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);
      vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);
      Pi = mod(Pi, 289.0);
      vec4 ix = Pi.xzxz;
      vec4 iy = Pi.yyww;
      vec4 fx = Pf.xzxz;
      vec4 fy = Pf.yyww;
      vec4 i = perm(perm(ix) + iy);
      vec4 gx = 2.0 * fract(i * 0.0243902439) - 1.0;
      vec4 gy = abs(gx) - 0.5;
      vec4 tx = floor(gx + 0.5);
      gx = gx - tx;
      vec2 g00 = vec2(gx.x, gy.x);
      vec2 g10 = vec2(gx.y, gy.y);
      vec2 g01 = vec2(gx.z, gy.z);
      vec2 g11 = vec2(gx.w, gy.w);
      vec4 norm = 1.79284291400159 - 0.85373472095314 * vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11));
      g00 *= norm.x;
      g01 *= norm.y;
      g10 *= norm.z;
      g11 *= norm.w;
      float n00 = dot(g00, vec2(fx.x, fy.x));
      float n10 = dot(g10, vec2(fx.y, fy.y));
      float n01 = dot(g01, vec2(fx.z, fy.z));
      float n11 = dot(g11, vec2(fx.w, fy.w));
      vec2 fade_xy = fade(Pf.xy);
      vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);
      float n_xy = mix(n_x.x, n_x.y, fade_xy.y);
      return 2.3 * n_xy;
    }
    void main() {
      float mouseDistance = length(vUv - uMousePosition);
      float t = uTime * 0.002;
      float elevation = vUv.y * uDensity * 10.0;
      float shadow = smoothstep(0.0, 0.3 + sin(t * 5.0 * 3.14) * 0.1, mouseDistance);
      elevation += shadow * 5.0;
      float displacement = cnoise(vec2(t + vUv.y * 2.0, t + vUv.x * 3.0)) * uDisplacement * 3.0;
      elevation += displacement * 4.0;
      elevation *= 2.0 + cnoise(vec2(t + vUv.y * 1.0, t + 0.5)) * 2.0;
      float paperNoise = cnoise(vec2(vUv.x * 2.4 - t * 0.25, vUv.y * 2.1 + t * 0.2));
      float paper = clamp(uLightness + paperNoise * uLightnessVariation, 0.82, 0.99);
      float layers = elevation * 0.22 + cnoise(vec2(vUv.x * 7.0 + t * 0.4, vUv.y * 6.0 - t * 0.35)) * 0.62;
      float band = fract(layers);
      float aa = 0.028;
      float contour = 1.0 - smoothstep(0.42 - aa, 0.42 + aa, abs(band - 0.5));
      float pools = smoothstep(0.52, 0.88, band);
      float thin = 1.0 - smoothstep(0.04, 0.09, abs(fract(layers * 3.2) - 0.5));
      float ink = clamp(pools * 1.0 + contour * 0.68 + thin * 0.34, 0.0, 1.0);
      float mouseInk = 1.0 - smoothstep(0.0, 0.45, mouseDistance);
      ink = clamp(ink + mouseInk * 0.18 * uDisplacement, 0.0, 1.0);
      float bw = step(0.6, ink);
      vec3 col = mix(vec3(1.0), vec3(0.0), bw);
      gl_FragColor = vec4(col, 1.0);
    }
  </script>
  <script id="vertexShader" type="x-shader/x-vertex">
    attribute vec3 position;
    attribute vec2 uv;
    uniform mat4 projectionMatrix;
    uniform mat4 modelViewMatrix;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec4 pos = vec4(position, 1.0);
      gl_Position = pos;
    }
  </script>
</head>
<body class="admin-body">

  <section id="hero" class="admin-hero-wrapper">
    <div class="world" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

  <section id="loginView" class="admin-card">
    <h1>Login Admin</h1>
    <form id="loginForm">
      <label>Email
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>
      <label>Senha
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <button type="submit" class="admin-btn admin-btn--primary">Entrar</button>
    </form>
    <p id="loginError" class="admin-error"></p>
  </section>

  <section id="dashboardView" class="admin-dashboard" hidden>
    <header class="admin-header">
      <h1>Painel Admin</h1>
      <div style="display: flex; gap: 0.5rem;">
        <a href="../index.html" class="admin-btn" style="text-decoration: none;">Voltar ao Site</a>
        <button id="logoutBtn" class="admin-btn">Sair</button>
      </div>
    </header>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2>Projetos</h2>
        <button id="newProjectBtn" class="admin-btn admin-btn--primary">+ Novo projeto</button>
      </div>
      <div id="projectsList" class="admin-list"></div>
    </section>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2>Experiências</h2>
        <button id="newExperienceBtn" class="admin-btn admin-btn--primary">+ Nova experiência</button>
      </div>
      <div id="experiencesList" class="admin-list"></div>
    </section>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2>Comentários</h2>
        <button id="newCommentBtn" class="admin-btn admin-btn--primary">+ Novo comentário</button>
      </div>
      <div id="commentsAdminList" class="admin-list"></div>
    </section>
  </section>

  <dialog id="projectDialog" class="admin-dialog">
    <form id="projectForm" class="admin-form">
      <h3 id="projectDialogTitle">Novo projeto</h3>
      <input type="hidden" id="projectId">
      <label>Título <input type="text" id="projectTitle" required></label>
      <label>Descrição <textarea id="projectDescription" rows="4" required></textarea></label>
      <label>Foto do projeto <input type="file" id="projectImageFile" accept="image/*"></label>
      <p class="admin-hint">Ou cole uma URL de imagem já existente:</p>
      <label>URL da imagem <input type="text" id="projectImageUrl" placeholder="https://..."></label>
      <label>Techs (separadas por vírgula) <input type="text" id="projectTechs" placeholder="React, Node.js, Supabase"></label>
      <label>Link ao vivo <input type="url" id="projectLiveUrl"></label>
      <label>Link GitHub <input type="url" id="projectGithubUrl"></label>
      <label>Ordem de exibição <input type="number" id="projectOrder" value="0"></label>
      <label class="admin-checkbox"><input type="checkbox" id="projectPublished"> Publicado (visível no site)</label>
      <p id="projectFormError" class="admin-error"></p>
      <div class="admin-dialog-actions">
        <button type="button" class="admin-btn" data-close>Cancelar</button>
        <button type="submit" class="admin-btn admin-btn--primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="experienceDialog" class="admin-dialog">
    <form id="experienceForm" class="admin-form">
      <h3 id="experienceDialogTitle">Nova experiência</h3>
      <input type="hidden" id="experienceId">
      <label>Título <input type="text" id="experienceTitle" required placeholder="Empresa — Cargo"></label>
      <label>Meta (período/local) <input type="text" id="experienceMeta" required placeholder="Jan/2026 - Atual · Remoto · Maceió/AL"></label>
      <label>Descrição <textarea id="experienceBody" rows="4" required></textarea></label>
      <label>Ordem de exibição <input type="number" id="experienceOrder" value="0"></label>
      <label class="admin-checkbox"><input type="checkbox" id="experiencePublished" checked> Publicado (visível no site)</label>
      <p id="experienceFormError" class="admin-error"></p>
      <div class="admin-dialog-actions">
        <button type="button" class="admin-btn" data-close>Cancelar</button>
        <button type="submit" class="admin-btn admin-btn--primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="commentDialog" class="admin-dialog">
    <form id="commentForm" class="admin-form">
      <h3 id="commentDialogTitle">Novo comentário</h3>
      <input type="hidden" id="commentId">
      <label>Nome <input type="text" id="commentName" required></label>
      <label>Email <input type="email" id="commentEmail" required></label>
      <label>LinkedIn (opcional) <input type="url" id="commentLinkedin" placeholder="https://linkedin.com/in/..."></label>
      <label>Como conhece você <input type="text" id="commentRole" placeholder="Colega de trabalho, professor..."></label>
      <label>Foto <input type="file" id="commentPhotoFile" accept="image/*"></label>
      <label>Mensagem <textarea id="commentMessage" rows="4" maxlength="1000" required></textarea></label>
      <label class="admin-checkbox"><input type="checkbox" id="commentApproved"> Publicado (visível no site)</label>
      <p id="commentFormError" class="admin-error"></p>
      <div class="admin-dialog-actions">
        <button type="button" class="admin-btn" data-close>Cancelar</button>
        <button type="submit" class="admin-btn admin-btn--primary">Salvar</button>
      </div>
    </form>
  </dialog>

  </section> <!-- /#hero -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/hero-section.js"></script>
  <script src="./admin.js"></script>
  <script>
    if (window.initHeroSection) {
      window.initHeroSection();
    }
  </script>
</body>
</html>
