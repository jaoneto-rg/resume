<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var status = params.get("cafe") || params.get("status");
      var target = "/" + (status ? "?cafe=" + encodeURIComponent(status) : "");
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecionando para a página principal... <a href="/">Clique aqui se não for redirecionado</a>.</p>
</body>
</html>
